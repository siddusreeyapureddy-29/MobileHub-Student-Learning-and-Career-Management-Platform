<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>MobileHub | Forgot Password</title>


    <!-- Bootstrap CSS -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <nav class="navbar custom-navbar">

        <div class="container">

            <a class="navbar-brand" href="index.html">

                <span class="brand-icon">
                    <i class="bi bi-phone"></i>
                </span>

                MobileHub

            </a>


            <a href="login.html" class="back-link">

                <i class="bi bi-arrow-left"></i>

                Back to Login

            </a>

        </div>

    </nav>


    <!-- ================= FORGOT PASSWORD SECTION ================= -->

    <section class="forgot-section">

        <div class="container">

            <div class="forgot-card">


                <div class="forgot-icon">

                    <i class="bi bi-key"></i>

                </div>


                <h1>Reset Password</h1>

                <p>
                    Enter your registered email and create a new password.
                </p>


                <!-- SUCCESS MESSAGE -->

                <div
                    id="successMessage"
                    class="alert alert-success d-none"
                    role="alert">

                    <i class="bi bi-check-circle-fill me-2"></i>

                    Password updated successfully!
                    Redirecting to login...

                </div>


                <!-- ERROR MESSAGE -->

                <div
                    id="errorMessage"
                    class="alert alert-danger d-none"
                    role="alert">

                </div>


                <!-- RESET FORM -->

                <form id="resetForm">


                    <!-- EMAIL -->

                    <div class="mb-3">

                        <label class="form-label">
                            Registered Email Address
                        </label>

                        <input
                            type="email"
                            id="resetEmail"
                            class="form-control"
                            placeholder="Enter your registered email"
                            required>

                    </div>


                    <!-- NEW PASSWORD -->

                    <div class="mb-3">

                        <label class="form-label">
                            New Password
                        </label>

                        <input
                            type="password"
                            id="newPassword"
                            class="form-control"
                            placeholder="Enter new password"
                            required>

                    </div>


                    <!-- CONFIRM PASSWORD -->

                    <div class="mb-3">

                        <label class="form-label">
                            Confirm New Password
                        </label>

                        <input
                            type="password"
                            id="confirmNewPassword"
                            class="form-control"
                            placeholder="Confirm new password"
                            required>


                        <!-- PASSWORD MISMATCH ERROR -->

                        <div
                            id="passwordError"
                            class="text-danger mt-2 d-none">

                            Passwords do not match!

                        </div>

                    </div>


                    <!-- RESET BUTTON -->

                    <button
                        type="submit"
                        class="reset-btn">

                        Reset Password

                        <i class="bi bi-arrow-right ms-1"></i>

                    </button>

                </form>


                <!-- LOGIN LINK -->

                <p class="login-text">

                    Remember your password?

                    <a href="login.html">
                        Log In
                    </a>

                </p>


            </div>

        </div>

    </section>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        const resetForm =
            document.getElementById("resetForm");

        const resetEmail =
            document.getElementById("resetEmail");

        const newPassword =
            document.getElementById("newPassword");

        const confirmNewPassword =
            document.getElementById("confirmNewPassword");

        const passwordError =
            document.getElementById("passwordError");

        const errorMessage =
            document.getElementById("errorMessage");

        const successMessage =
            document.getElementById("successMessage");


        /* ================= CHECK PASSWORD ON BLUR ================= */

        confirmNewPassword.addEventListener("blur", function () {

            if (
                confirmNewPassword.value !== "" &&
                newPassword.value !== confirmNewPassword.value
            ) {

                passwordError.classList.remove("d-none");

                confirmNewPassword.classList.add("is-invalid");

            } else {

                passwordError.classList.add("d-none");

                confirmNewPassword.classList.remove("is-invalid");

            }

        });


        /* ================= RESET PASSWORD ================= */

        resetForm.addEventListener("submit", function (event) {

            event.preventDefault();


            // Get saved email

            const savedEmail =
                localStorage.getItem("userEmail");


            // Hide previous error

            errorMessage.classList.add("d-none");


            // Check whether account exists

            if (savedEmail === null) {

                errorMessage.innerHTML =
                    '<i class="bi bi-exclamation-circle-fill me-2"></i>' +
                    'No account found! Please create an account first.';

                errorMessage.classList.remove("d-none");

                return;

            }


            // Check whether entered email matches

            if (
                resetEmail.value.trim() !== savedEmail
            ) {

                errorMessage.innerHTML =
                    '<i class="bi bi-exclamation-circle-fill me-2"></i>' +
                    'This email is not registered!';

                errorMessage.classList.remove("d-none");

                return;

            }


            // Check passwords

            if (
                newPassword.value !== confirmNewPassword.value
            ) {

                passwordError.classList.remove("d-none");

                confirmNewPassword.classList.add("is-invalid");

                return;

            }


            // Update password

            localStorage.setItem(
                "userPassword",
                newPassword.value
            );


            // Hide form

            resetForm.classList.add("d-none");


            // Hide login text

            document
                .querySelector(".login-text")
                .classList.add("d-none");


            // Show success message

            successMessage.classList.remove("d-none");


            // Redirect to login page after 2 seconds

            setTimeout(function () {

                window.location.href = "login.html";

            }, 2000);

        });

    </script>


    <!-- Bootstrap JavaScript -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
