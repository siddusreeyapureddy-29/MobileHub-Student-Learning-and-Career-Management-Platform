<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MobileHub | My Profile</title>


    <!-- Bootstrap CSS -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <nav class="navbar custom-navbar">

        <div class="container">

            <a class="navbar-brand" href="dashboard.html">

                <span class="brand-icon">

                    <i class="bi bi-phone"></i>

                </span>

                MobileHub

            </a>


            <a href="dashboard.html" class="back-link">

                <i class="bi bi-arrow-left"></i>

                Back to Dashboard

            </a>

        </div>

    </nav>


    <!-- ================= PROFILE SECTION ================= -->

    <section class="profile-section">

        <div class="container">


            <!-- PAGE HEADER -->

            <div class="profile-header">

                <h1>My Profile</h1>

                <p>
                    Manage your personal and academic information.
                </p>

            </div>


            <!-- PROFILE CARD -->

            <div class="profile-card">


                <!-- PROFILE ICON -->

                <div class="profile-icon">

                    <i class="bi bi-person"></i>

                </div>


                <!-- SUCCESS MESSAGE -->

                <div
                    id="successMessage"
                    class="alert alert-success d-none"
                    role="alert">

                    <i class="bi bi-check-circle-fill me-2"></i>

                    Profile saved successfully!

                </div>


                <!-- PROFILE FORM -->

                <form id="profileForm">


                    <div class="row">


                        <!-- FULL NAME -->

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Full Name

                            </label>


                            <input
                                type="text"
                                id="profileName"
                                class="form-control"
                                placeholder="Enter your name"
                                required>

                        </div>


                        <!-- EMAIL -->

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Email Address

                            </label>


                            <input
                                type="email"
                                id="profileEmail"
                                class="form-control"
                                readonly>

                        </div>


                        <!-- EDUCATION -->

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Education

                            </label>


                            <input
                                type="text"
                                id="education"
                                class="form-control"
                                placeholder="Example: B.Tech"
                                required>

                        </div>


                        <!-- COLLEGE -->

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                College

                            </label>


                            <input
                                type="text"
                                id="college"
                                class="form-control"
                                placeholder="Enter your college name"
                                required>

                        </div>


                        <!-- CURRENT YEAR -->

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Current Year

                            </label>


                            <select
                                id="currentYear"
                                class="form-select"
                                required>

                                <option value="">
                                    Select Year
                                </option>

                                <option value="1st Year">
                                    1st Year
                                </option>

                                <option value="2nd Year">
                                    2nd Year
                                </option>

                                <option value="3rd Year">
                                    3rd Year
                                </option>

                                <option value="4th Year">
                                    4th Year
                                </option>

                                <option value="Graduate">
                                    Graduate
                                </option>

                            </select>

                        </div>


                        <!-- SKILLS -->

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Skills

                            </label>


                            <input
                                type="text"
                                id="skills"
                                class="form-control"
                                placeholder="Example: Java, HTML, CSS">

                        </div>


                        <!-- CAREER GOAL -->

                        <div class="col-12 mb-3">

                            <label class="form-label">

                                Career Goal

                            </label>


                            <textarea
                                id="careerGoal"
                                class="form-control"
                                rows="3"
                                placeholder="Example: Become a Java Full Stack Developer"></textarea>

                        </div>


                    </div>


                    <!-- SAVE BUTTON -->

                    <button
                        type="submit"
                        class="save-btn">

                        Save Profile

                        <i class="bi bi-check-lg ms-1"></i>

                    </button>


                </form>

            </div>

        </div>

    </section>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        /* ================= GET FORM ELEMENTS ================= */

        const profileForm =
            document.getElementById("profileForm");

        const profileName =
            document.getElementById("profileName");

        const profileEmail =
            document.getElementById("profileEmail");

        const education =
            document.getElementById("education");

        const college =
            document.getElementById("college");

        const currentYear =
            document.getElementById("currentYear");

        const skills =
            document.getElementById("skills");

        const careerGoal =
            document.getElementById("careerGoal");

        const successMessage =
            document.getElementById("successMessage");


        /* ================= LOAD REGISTERED DATA ================= */

        profileName.value =
            localStorage.getItem("userName") || "";

        profileEmail.value =
            localStorage.getItem("userEmail") || "";


        /* ================= LOAD SAVED PROFILE DATA ================= */

        education.value =
            localStorage.getItem("education") || "";

        college.value =
            localStorage.getItem("college") || "";

        currentYear.value =
            localStorage.getItem("currentYear") || "";

        skills.value =
            localStorage.getItem("skills") || "";

        careerGoal.value =
            localStorage.getItem("careerGoal") || "";


        /* ================= SAVE PROFILE ================= */

        profileForm.addEventListener("submit", function (event) {

            event.preventDefault();


            // Save profile details

            localStorage.setItem(
                "userName",
                profileName.value.trim()
            );

            localStorage.setItem(
                "education",
                education.value.trim()
            );

            localStorage.setItem(
                "college",
                college.value.trim()
            );

            localStorage.setItem(
                "currentYear",
                currentYear.value
            );

            localStorage.setItem(
                "skills",
                skills.value.trim()
            );

            localStorage.setItem(
                "careerGoal",
                careerGoal.value.trim()
            );


            // Show success message

            successMessage.classList.remove("d-none");


            // Hide message after 3 seconds

            setTimeout(function () {

                successMessage.classList.add("d-none");

            }, 3000);

        });

    </script>


    <!-- Bootstrap JavaScript -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
