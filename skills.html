<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>MobileHub | Skills Tracker</title>


    <!-- Bootstrap CSS -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-expand-lg custom-navbar">

        <div class="container">


            <!-- LOGO -->

            <a class="navbar-brand" href="dashboard.html">

                <span class="brand-icon">

                    <i class="bi bi-phone"></i>

                </span>

                MobileHub

            </a>


            <!-- TOGGLER -->

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">

                <span class="navbar-toggler-icon"></span>

            </button>


            <!-- NAVIGATION -->

            <div
                class="collapse navbar-collapse"
                id="navbarMenu">

                <ul class="navbar-nav ms-auto">


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="dashboard.html">

                            Dashboard

                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="explore.html">

                            Explore

                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="study-planner.html">

                            Study Planner

                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link active"
                            href="skills.html">

                            Skills

                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="profile.html">

                            Profile

                        </a>

                    </li>


                </ul>

            </div>

        </div>

    </nav>


    <!-- ================= SKILLS SECTION ================= -->

    <section class="skills-section">

        <div class="container">


            <!-- PAGE HEADER -->

            <div class="page-header">

                <h1>Skills Tracker</h1>

                <p>
                    Track your skills and monitor your learning progress.
                </p>

            </div>


            <!-- ================= STATISTICS ================= -->

            <div class="row g-4 mb-5">


                <div class="col-md-6">

                    <div class="stat-card">

                        <h3 id="totalSkills">0</h3>

                        <p>Total Skills</p>

                    </div>

                </div>


                <div class="col-md-6">

                    <div class="stat-card">

                        <h3 id="averageProgress">0%</h3>

                        <p>Average Progress</p>

                    </div>

                </div>


            </div>


            <div class="row g-4">


                <!-- ================= ADD SKILL ================= -->

                <div class="col-lg-4">

                    <div class="skills-card">

                        <h3>Add New Skill</h3>


                        <form id="skillForm">


                            <!-- SKILL NAME -->

                            <div class="mb-3">

                                <label class="form-label">

                                    Skill Name

                                </label>


                                <input
                                    type="text"
                                    id="skillName"
                                    class="form-control"
                                    placeholder="Example: Java"
                                    required>

                            </div>


                            <!-- CATEGORY -->

                            <div class="mb-3">

                                <label class="form-label">

                                    Category

                                </label>


                                <select
                                    id="skillCategory"
                                    class="form-select"
                                    required>

                                    <option value="">
                                        Select Category
                                    </option>

                                    <option value="Programming">
                                        Programming
                                    </option>

                                    <option value="Web Development">
                                        Web Development
                                    </option>

                                    <option value="Database">
                                        Database
                                    </option>

                                    <option value="Data Science">
                                        Data Science
                                    </option>

                                    <option value="Tools">
                                        Tools
                                    </option>

                                    <option value="Other">
                                        Other
                                    </option>

                                </select>

                            </div>


                            <!-- PROGRESS -->

                            <div class="mb-4">

                                <label class="form-label">

                                    Progress Percentage

                                </label>


                                <input
                                    type="number"
                                    id="skillProgress"
                                    class="form-control"
                                    placeholder="Example: 80"
                                    min="0"
                                    max="100"
                                    required>

                            </div>


                            <!-- ADD BUTTON -->

                            <button
                                type="submit"
                                class="add-btn">

                                <i class="bi bi-plus-lg me-1"></i>

                                Add Skill

                            </button>

                        </form>

                    </div>

                </div>


                <!-- ================= SKILL LIST ================= -->

                <div class="col-lg-8">

                    <div class="skills-card">

                        <h3>My Skills</h3>


                        <div id="skillsList">

                        </div>

                    </div>

                </div>


            </div>

        </div>

    </section>


    <!-- ================= JAVASCRIPT ================= -->

    <script>


        /* ================= GET ELEMENTS ================= */

        const skillForm =
            document.getElementById("skillForm");

        const skillName =
            document.getElementById("skillName");

        const skillCategory =
            document.getElementById("skillCategory");

        const skillProgress =
            document.getElementById("skillProgress");

        const skillsList =
            document.getElementById("skillsList");


        /* ================= LOAD SKILLS ================= */

        let skills =
            JSON.parse(
                localStorage.getItem("userSkills")
            ) || [];


        /* ================= SAVE SKILLS ================= */

        function saveSkills() {

            localStorage.setItem(
                "userSkills",
                JSON.stringify(skills)
            );

        }


        /* ================= UPDATE STATISTICS ================= */

        function updateStats() {

            const total =
                skills.length;

            let average = 0;


            if (total > 0) {

                const totalProgress =
                    skills.reduce(
                        function (sum, skill) {

                            return sum +
                                Number(skill.progress);

                        },
                        0
                    );


                average =
                    Math.round(
                        totalProgress / total
                    );

            }


            document.getElementById(
                "totalSkills"
            ).textContent = total;


            document.getElementById(
                "averageProgress"
            ).textContent =
                average + "%";

        }


        /* ================= DISPLAY SKILLS ================= */

        function displaySkills() {

            skillsList.innerHTML = "";


            /* IF NO SKILLS */

            if (skills.length === 0) {

                skillsList.innerHTML = `

                    <div class="empty-message">

                        <i class="bi bi-code-slash"></i>

                        <h5>No skills added yet</h5>

                        <p>
                            Add your first skill and start tracking
                            your progress.
                        </p>

                    </div>

                `;

                updateStats();

                return;

            }


            /* DISPLAY EACH SKILL */

            skills.forEach(
                function (skill, index) {

                    skillsList.innerHTML += `

                        <div class="skill-item">


                            <div
                                class="d-flex
                                justify-content-between
                                align-items-start
                                flex-wrap">


                                <div>

                                    <div class="skill-name">

                                        ${skill.name}

                                    </div>


                                    <div class="skill-category">

                                        ${skill.category}

                                    </div>

                                </div>


                                <!-- BUTTONS -->

                                <div class="skill-actions">


                                    <button
                                        class="edit-btn"
                                        onclick="editSkill(${index})">

                                        <i class="bi bi-pencil"></i>

                                    </button>


                                    <button
                                        class="delete-btn"
                                        onclick="deleteSkill(${index})">

                                        <i class="bi bi-trash"></i>

                                    </button>


                                </div>


                            </div>


                            <!-- PROGRESS BAR -->

                            <div
                                class="progress"
                                role="progressbar"
                                aria-valuenow="${skill.progress}"
                                aria-valuemin="0"
                                aria-valuemax="100">


                                <div
                                    class="progress-bar"
                                    style="width: ${skill.progress}%">

                                </div>


                            </div>


                            <div class="progress-text">

                                ${skill.progress}% Complete

                            </div>


                        </div>

                    `;

                }
            );


            updateStats();

        }


        /* ================= ADD SKILL ================= */

        skillForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                const newSkill = {

                    name:
                        skillName.value.trim(),

                    category:
                        skillCategory.value,

                    progress:
                        Number(skillProgress.value)

                };


                skills.push(newSkill);


                saveSkills();


                displaySkills();


                skillForm.reset();

            }
        );


        /* ================= EDIT SKILL ================= */

        function editSkill(index) {

            const newProgress =
                prompt(
                    "Enter new progress percentage (0-100):",
                    skills[index].progress
                );


            if (
                newProgress === null
            ) {

                return;

            }


            if (
                newProgress === "" ||
                newProgress < 0 ||
                newProgress > 100
            ) {

                return;

            }


            skills[index].progress =
                Number(newProgress);


            saveSkills();


            displaySkills();

        }


        /* ================= DELETE SKILL ================= */

        function deleteSkill(index) {

            skills.splice(index, 1);


            saveSkills();


            displaySkills();

        }


        /* ================= INITIAL DISPLAY ================= */

        displaySkills();


    </script>


    <!-- Bootstrap JavaScript -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">

    </script>


</body>

</html>
