<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>MobileHub | Study Planner</title>


    <!-- Bootstrap CSS -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-expand-lg custom-navbar">

        <div class="container">


            <a class="navbar-brand" href="dashboard.html">

                <span class="brand-icon">

                    <i class="bi bi-phone"></i>

                </span>

                MobileHub

            </a>


            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">

                <span class="navbar-toggler-icon"></span>

            </button>


            <div
                class="collapse navbar-collapse"
                id="navbarMenu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="dashboard.html">

                            Dashboard

                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="explore.html">

                            Explore

                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link active"
                            href="study-planner.html">

                            Study Planner

                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="profile.html">

                            Profile

                        </a>

                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- ================= STUDY PLANNER ================= -->

    <section class="planner-section">

        <div class="container">


            <!-- PAGE HEADER -->

            <div class="page-header">

                <h1>Study Planner</h1>

                <p>
                    Organize your study tasks and stay on track with your goals.
                </p>

            </div>


            <!-- STATISTICS -->

            <div class="row g-4 mb-5">


                <div class="col-md-4">

                    <div class="stat-card">

                        <h3 id="totalTasks">0</h3>

                        <p>Total Tasks</p>

                    </div>

                </div>


                <div class="col-md-4">

                    <div class="stat-card">

                        <h3 id="completedTasks">0</h3>

                        <p>Completed</p>

                    </div>

                </div>


                <div class="col-md-4">

                    <div class="stat-card">

                        <h3 id="pendingTasks">0</h3>

                        <p>Pending</p>

                    </div>

                </div>

            </div>


            <div class="row g-4">


                <!-- ================= ADD TASK ================= -->

                <div class="col-lg-4">

                    <div class="planner-card">

                        <h3>Add New Task</h3>


                        <form id="taskForm">


                            <!-- TASK NAME -->

                            <div class="mb-3">

                                <label class="form-label">

                                    Study Task

                                </label>


                                <input
                                    type="text"
                                    id="taskName"
                                    class="form-control"
                                    placeholder="Example: Learn Java"
                                    required>

                            </div>


                            <!-- DEADLINE -->

                            <div class="mb-3">

                                <label class="form-label">

                                    Deadline

                                </label>


                                <input
                                    type="date"
                                    id="deadline"
                                    class="form-control"
                                    required>

                            </div>


                            <!-- PRIORITY -->

                            <div class="mb-4">

                                <label class="form-label">

                                    Priority

                                </label>


                                <select
                                    id="priority"
                                    class="form-select"
                                    required>

                                    <option value="">
                                        Select Priority
                                    </option>

                                    <option value="High">
                                        High
                                    </option>

                                    <option value="Medium">
                                        Medium
                                    </option>

                                    <option value="Low">
                                        Low
                                    </option>

                                </select>

                            </div>


                            <!-- ADD BUTTON -->

                            <button
                                type="submit"
                                class="add-btn">

                                <i class="bi bi-plus-lg me-1"></i>

                                Add Task

                            </button>

                        </form>

                    </div>

                </div>


                <!-- ================= TASK LIST ================= -->

                <div class="col-lg-8">

                    <div class="planner-card">

                        <h3>My Study Tasks</h3>


                        <div
                            id="taskList"
                            class="task-list">

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        const taskForm =
            document.getElementById("taskForm");

        const taskName =
            document.getElementById("taskName");

        const deadline =
            document.getElementById("deadline");

        const priority =
            document.getElementById("priority");

        const taskList =
            document.getElementById("taskList");


        // Get tasks from localStorage

        let tasks =
            JSON.parse(
                localStorage.getItem("studyTasks")
            ) || [];


        /* ================= SAVE TASKS ================= */

        function saveTasks() {

            localStorage.setItem(
                "studyTasks",
                JSON.stringify(tasks)
            );

        }


        /* ================= UPDATE STATISTICS ================= */

        function updateStats() {

            const total =
                tasks.length;

            const completed =
                tasks.filter(function (task) {

                    return task.completed;

                }).length;

            const pending =
                total - completed;


            document.getElementById(
                "totalTasks"
            ).textContent = total;


            document.getElementById(
                "completedTasks"
            ).textContent = completed;


            document.getElementById(
                "pendingTasks"
            ).textContent = pending;

        }


        /* ================= DISPLAY TASKS ================= */

        function displayTasks() {

            taskList.innerHTML = "";


            // If no tasks

            if (tasks.length === 0) {

                taskList.innerHTML = `

                    <div class="empty-message">

                        <i class="bi bi-journal-x"></i>

                        <h5>No study tasks yet</h5>

                        <p>
                            Add your first task and start planning.
                        </p>

                    </div>

                `;

                updateStats();

                return;

            }


            // Display each task

            tasks.forEach(function (task, index) {

                let priorityClass = "";


                if (task.priority === "High") {

                    priorityClass =
                        "priority-high";

                }

                else if (
                    task.priority === "Medium"
                ) {

                    priorityClass =
                        "priority-medium";

                }

                else {

                    priorityClass =
                        "priority-low";

                }


                taskList.innerHTML += `

                    <div
                        class="task-item ${
                            task.completed
                                ? "completed"
                                : ""
                        }">

                        <div
                            class="d-flex
                            justify-content-between
                            align-items-start
                            flex-wrap">

                            <div>

                                <div class="task-title">

                                    ${task.name}

                                </div>


                                <div class="task-details">

                                    <i class="bi bi-calendar-event me-1"></i>

                                    Deadline:
                                    ${task.deadline}

                                </div>


                                <span
                                    class="priority
                                    ${priorityClass}">

                                    ${task.priority}

                                </span>

                            </div>


                            <div class="task-actions">


                                <button
                                    class="complete-btn"
                                    onclick="toggleTask(${index})">

                                    <i class="bi bi-check-lg"></i>

                                </button>


                                <button
                                    class="delete-btn"
                                    onclick="deleteTask(${index})">

                                    <i class="bi bi-trash"></i>

                                </button>

                            </div>

                        </div>

                    </div>

                `;

            });


            updateStats();

        }


        /* ================= ADD TASK ================= */

        taskForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                const newTask = {

                    name:
                        taskName.value.trim(),

                    deadline:
                        deadline.value,

                    priority:
                        priority.value,

                    completed:
                        false

                };


                tasks.push(newTask);


                saveTasks();


                displayTasks();


                taskForm.reset();

            }
        );


        /* ================= COMPLETE TASK ================= */

        function toggleTask(index) {

            tasks[index].completed =
                !tasks[index].completed;


            saveTasks();


            displayTasks();

        }


        /* ================= DELETE TASK ================= */

        function deleteTask(index) {

            tasks.splice(index, 1);


            saveTasks();


            displayTasks();

        }


        /* ================= INITIAL DISPLAY ================= */

        displayTasks();

    </script>


    <!-- Bootstrap JavaScript -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">

    </script>

</body>

</html>
